name: Android tablet
on:
  push:
    paths: ['tablet/**', '.github/workflows/tablet.yml']
  pull_request:
    paths: ['tablet/**', '.github/workflows/tablet.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test protocol, check Android and assemble APK
        working-directory: tablet
        run: bash gradlew :protocol:test :pricing:test :app:lintDebug :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: jesper3d-tablet-debug
          path: tablet/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tablet-check-reports
          path: |
            tablet/protocol/build/reports/tests/
            tablet/pricing/build/reports/tests/
            tablet/app/build/reports/lint-results-debug.html
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch and inspect the tablet interface
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_c
          disable-animations: true
          script: |
            adb shell wm size 1600x1000
            adb shell wm density 160
            (cd tablet && bash gradlew :app:connectedDebugAndroidTest --stacktrace)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tablet-ui-check
          path: |
            tablet/app/build/outputs/connected_android_test_additional_output/
            tablet/app/build/reports/androidTests/connected/
