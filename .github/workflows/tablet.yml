name: Android tablet
on:
  push:
    paths: ['tablet/**', '.github/workflows/tablet.yml']
  pull_request:
    paths: ['tablet/**', '.github/workflows/tablet.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test protocol, check Android and assemble APK
        working-directory: tablet
        run: bash gradlew :protocol:test :app:lintDebug :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: jesper3d-tablet-debug
          path: tablet/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tablet-check-reports
          path: |
            tablet/protocol/build/reports/tests/
            tablet/app/build/reports/lint-results-debug.html
